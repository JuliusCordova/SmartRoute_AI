name: SmartRoute manual WIF staging preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wif-preflight:
    name: verify-wif-private-smoke
    if: github.ref == 'refs/heads/main' && github.repository == 'JuliusCordova/SmartRoute_AI'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate deployer with Workload Identity Federation
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/913797829604/locations/global/workloadIdentityPools/smartroute-ci/providers/smartroute-main
          service_account: smartroute-deployer@proyectopersonal-480420.iam.gserviceaccount.com
          project_id: proyectopersonal-480420
      - uses: google-github-actions/setup-gcloud@v3
      - name: Verify CI identity access to ONLY SmartRoute deployment resources
        run: |
          set -euo pipefail
          gcloud artifacts repositories describe smartroute-staging \
            --project=proyectopersonal-480420 --location=us-central1 \
            --format='value(name)' >/dev/null
          ACTUAL_SA="$(gcloud run services describe smartroute-api-staging \
            --project=proyectopersonal-480420 --region=us-central1 \
            --format='value(spec.template.spec.serviceAccountName)')"
          test "$ACTUAL_SA" = 'smartroute-runtime@proyectopersonal-480420.iam.gserviceaccount.com'
          echo "PASS: federated deployer can read dedicated registry and service metadata"
      - name: Authenticate smoke with Workload Identity Federation and issue audience-bound ID token
        id: smoke_auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/913797829604/locations/global/workloadIdentityPools/smartroute-ci/providers/smartroute-main
          service_account: smartroute-smoke@proyectopersonal-480420.iam.gserviceaccount.com
          project_id: proyectopersonal-480420
          token_format: id_token
          id_token_audience: https://smartroute-api-staging-913797829604.us-central1.run.app
          id_token_include_email: true
      - name: Verify private Cloud Run /health and /ready
        env:
          SERVICE_URL: https://smartroute-api-staging-913797829604.us-central1.run.app
          ACCESS_TOKEN: ${{ steps.smoke_auth.outputs.id_token }}
        run: bash scripts/smoke-test.sh
      - name: Preflight evidence
        run: |
          echo "## WIF staging preflight PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "Deployer and smoke service accounts authenticated from GitHub Actions main." >> "$GITHUB_STEP_SUMMARY"
          echo "Private Cloud Run /health and /ready passed. No deployment, IAM or Firestore mutation attempted." >> "$GITHUB_STEP_SUMMARY"
