name: SmartRoute CI and automated staging
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smartroute-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-tests:
    name: api-tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - name: Dependencies
        run: python -m pip install -r requirements.txt && python -m pip check
      - name: Static syntax
        run: python -m compileall -q app tests
      - name: Unit tests
        run: python -m pytest -q
      - name: Docker build
        run: docker build -t smartroute-api:ci .

  deploy-staging:
    name: deploy-staging
    needs: [api-tests]
    # Staging is opt-in. No GCP calls until the owner configures repo variables and WIF.
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      vars.GCP_STAGING_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate with WIF (no JSON keys)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      - name: Deploy private Cloud Run service from source
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: smartroute-api-staging
          project_id: ${{ vars.GCP_PROJECT_ID }}
          region: ${{ vars.GCP_REGION }}
          source: services/api
          flags: '--no-allow-unauthenticated --min-instances=0 --service-account=${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}'
          env_vars: |
            APP_ENV=staging
            FIREBASE_PROJECT_ID=${{ vars.GCP_PROJECT_ID }}
      - name: Record revision and service URL
        env:
          DEPLOYED_URL: ${{ steps.deploy.outputs.url }}
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
        run: |
          echo "Cloud Run staging URL: $DEPLOYED_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Project: $PROJECT_ID, region: $REGION" >> "$GITHUB_STEP_SUMMARY"
          echo "Staging deployed; authenticated API smoke and Firestore integration require separate evidence." >> "$GITHUB_STEP_SUMMARY"
