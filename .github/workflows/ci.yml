name: SmartRoute CI and automated staging
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smartroute-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-tests:
    name: api-tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - name: Dependencies
        run: python -m pip install -r requirements.txt && python -m pip check
      - name: Static syntax
        run: python -m compileall -q app tests
      - name: Unit tests
        run: python -m pytest -q
      - name: Validate shell smoke script
        run: bash -n ../../scripts/smoke-test.sh ../../scripts/gcp-bootstrap-smartroute-identities.sh ../../scripts/gcp-bind-smartroute-iam.sh ../../scripts/gcp-verify-smartroute-iam.sh ../../scripts/gcp-cloudrun-readiness.sh ../../scripts/gcp-bootstrap-staging-service.sh ../../scripts/gcp-recover-staging-push.sh ../../scripts/gcp-verify-staging-http.sh ../../scripts/gcp-bind-staging-deploy-iam.sh ../../scripts/gcp-verify-staging-deploy-iam.sh ../../scripts/github-configure-staging-vars.sh ../../scripts/github-protect-staging.sh ../../scripts/gcp-firestore-runtime-e2e.sh ../../scripts/gcp-bootstrap-gateway-identity.sh ../../scripts/gcp-bootstrap-private-gateway.sh ../../scripts/gcp-recover-gateway-push.sh
      - name: Reject empty gcloud value projection in IAM scripts
        run: |
          if grep -nF -- "--format=value()" ../../scripts/gcp-bind-staging-deploy-iam.sh || grep -nF -- "--format='value()'" ../../scripts/gcp-bind-staging-deploy-iam.sh; then
            echo 'Invalid empty gcloud value projection'; exit 1
          fi
      - name: Compile isolated Firestore runtime E2E script
        run: python -m py_compile ../../scripts/gcp-firestore-runtime-e2e.py
      - name: Gateway isolated unit tests
        run: |
          python -m pip install -r ../gateway/requirements.txt
          (cd ../gateway && python -m pytest -q tests)
      - name: Docker build
        run: |
          docker build -t smartroute-api:ci .
          docker build -t smartroute-gateway:ci ../gateway

  firestore-integration:
    name: firestore-emulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: python -m pip install -r services/api/requirements.txt
      - run: npm install -g firebase-tools
      - name: Firestore emulator integration (no GCP billing)
        run: firebase emulators:exec --only firestore --project demo-smartroute 'bash -c "cd services/api && FIRESTORE_EMULATOR_REQUIRED=1 python -m pytest -q tests/test_firestore_integration.py tests/test_route_transaction.py"'

  deploy-staging:
    name: deploy-staging
    needs: [api-tests, firestore-integration]
    # Staging is opt-in. No GCP calls until the owner configures repo variables and WIF.
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      vars.GCP_STAGING_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate staging configuration
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
          PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          DEPLOYER: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
          RUNTIME: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
          SMOKE: ${{ vars.GCP_SMOKE_SERVICE_ACCOUNT }}
          FIRESTORE_DATABASE_ID: ${{ vars.GCP_FIRESTORE_DATABASE_ID }}
        run: |
          for var in PROJECT_ID REGION PROVIDER DEPLOYER RUNTIME SMOKE FIRESTORE_DATABASE_ID; do
            if [ -z "${!var}" ]; then echo "::error::Missing staging configuration: $var"; exit 1; fi
          done
          if [ "$PROJECT_ID" != "proyectopersonal-480420" ]; then
            echo "::error::Unexpected GCP project. SmartRoute staging is pinned to proyectopersonal-480420."
            exit 1
          fi
          if [ "$REGION" != "us-central1" ]; then echo "::error::Approved staging region is us-central1"; exit 1; fi
          if [ "$PROVIDER" != "projects/913797829604/locations/global/workloadIdentityPools/smartroute-ci/providers/smartroute-main" ]; then echo "::error::Unexpected WIF provider"; exit 1; fi
          if [ "$FIRESTORE_DATABASE_ID" != "smartroute" ]; then
            echo "::error::Staging must use dedicated named Firestore database smartroute"
            exit 1
          fi
          for account in "$DEPLOYER" "$RUNTIME" "$SMOKE"; do
            case "$account" in
              *"@proyectopersonal-480420.iam.gserviceaccount.com") ;;
              *) echo "::error::Service account must belong to approved GCP project"; exit 1 ;;
            esac
          done
      - name: Authenticate with WIF (no JSON keys)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Build and push immutable SmartRoute image
        id: image
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/smartroute-staging/smartroute-api"
          TAG="$IMAGE:$COMMIT_SHA"
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build --pull -t "$TAG" services/api
          docker push "$TAG" | tee /tmp/smartroute-docker-push.log
          DIGEST="$(awk '/digest: sha256:/ {for (i=1;i<=NF;i++) if ($i=="digest:") {print $(i+1)}}' /tmp/smartroute-docker-push.log | tail -n 1)"
          if [[ ! "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::No immutable image digest was returned by Docker push"
            exit 1
          fi
          echo "uri=$IMAGE@$DIGEST" >> "$GITHUB_OUTPUT"
      - name: Deploy private Cloud Run service from verified image
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: smartroute-api-staging
          project_id: ${{ vars.GCP_PROJECT_ID }}
          region: ${{ vars.GCP_REGION }}
          image: ${{ steps.image.outputs.uri }}
          wait: true
          flags: '--min-instances=0 --max-instances=2 --service-account=${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}'
          env_vars: |
            APP_ENV=staging
            FIREBASE_PROJECT_ID=${{ vars.GCP_PROJECT_ID }}
            GOOGLE_CLOUD_PROJECT=${{ vars.GCP_PROJECT_ID }}
            FIRESTORE_DATABASE_ID=${{ vars.GCP_FIRESTORE_DATABASE_ID }}
      - name: Generate audience-bound ID token for private staging
        id: smoke_auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SMOKE_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ steps.deploy.outputs.url }}
          id_token_include_email: true
      - name: Authenticated smoke on deployed revision
        env:
          SERVICE_URL: ${{ steps.deploy.outputs.url }}
          ACCESS_TOKEN: ${{ steps.smoke_auth.outputs.id_token }}
        run: bash scripts/smoke-test.sh
      - name: Record verified staging evidence
        if: success()
        env:
          DEPLOYED_URL: ${{ steps.deploy.outputs.url }}
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
        run: |
          echo "## SmartRoute staging smoke PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "Cloud Run URL: $DEPLOYED_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Project: $PROJECT_ID, region: $REGION" >> "$GITHUB_STEP_SUMMARY"
          echo "HTTP /health and /ready checks passed with Cloud Run IAM; /ready is process-only." >> "$GITHUB_STEP_SUMMARY"
          echo "Firebase Auth, orders and Firestore staging persistence still require an authenticated application test." >> "$GITHUB_STEP_SUMMARY"
